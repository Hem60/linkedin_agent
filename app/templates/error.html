{% extends "base.html" %}
{% block title %}{{ status }} · PostPilot{% endblock %}
{% block shell_class %}narrow{% endblock %}

{% block content %}
<div class="errorpage">
  <div class="errorcode" aria-hidden="true">{{ status }}</div>
  <h1>{{ heading }}</h1>
  <p>{{ message }}</p>
  <div class="errorcta">
    {% if status == 401 %}
      <a class="btn btn-primary" href="/auth/login">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.45 20.45h-3.55v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.13 1.45-2.13 2.94v5.67H9.35V9h3.41v1.56h.05c.47-.9 1.63-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zM7.12 20.45H3.55V9h3.57v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.72v20.56C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.72V1.72C24 .77 23.2 0 22.22 0z"/></svg>
        Sign in with LinkedIn
      </a>
    {% else %}
      <a class="btn btn-primary" href="/">Back to safety</a>
    {% endif %}
  </div>
</div>
{% endblock %}
